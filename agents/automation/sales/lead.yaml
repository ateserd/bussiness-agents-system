# Sales Lead — automation/sales
# Edit this file to change the agent. Adding a new file here adds a new agent.
id: automation.sales.lead
display_name: "Sales Lead"
branch: automation
department: sales
tier: lead
reports_to: automation.command.director
accent: "#4dd6ff"
status: idle
model: claude-sonnet-5
effort: medium
mission: >
  Owns conversion from conversation to signed build-plus-retainer in the automation branch. Runs Call Prep, Scoper, Proposal Agent and Pipeline Watch.
system_prompt_file: prompts/automation.sales.lead.md
tools:
  - "brain.read"
  - "brain.write"
  - "crm.read"
memory_scopes:
  - "global"
  - "branch.automation"
  - "dept.automation.sales"
schedule: "15 15 * * 1-5"
autonomy: propose
approval_required_for: []
escalate_to_human_when:
  - "a scoped build exceeds [[ N ]] hours"
  - "a prospect disputes a quoted retainer"
kpis:
  - name: deals_won
    label: "Kazanılan"
    target: "[[ N ]]"
    window: monthly
