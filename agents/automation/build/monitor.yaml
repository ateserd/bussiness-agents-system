# Monitor — automation/build
# Edit this file to change the agent. Adding a new file here adds a new agent.
#
# Hourly, because the prompt's definition of broken includes *silent*: a
# workflow that has not run when it should have. Catching that needs a cadence
# tighter than the cadence being watched.
id: automation.build.monitor
display_name: "Monitor"
branch: automation
department: build
tier: worker
reports_to: automation.build.lead
accent: "#3ddc84"
status: idle
model: claude-haiku-4-5
effort: low
mission: >
  Checks every live automation against its expected cadence each hour, treats erroring and silent as equally broken, and opens an incident with the client, the last good run and the error.
system_prompt_file: prompts/automation.build.monitor.md
tools:
  - "brain.read"
  - "brain.write"
  - "crm.read"
  - "browser"
memory_scopes:
  - "global"
  - "branch.automation"
  - "dept.automation.build"
schedule: "0 * * * *"
autonomy: act_with_log
approval_required_for: []
escalate_to_human_when:
  - "a client-facing automation has been silent past its expected run"
kpis:
  - name: healthy_ratio
    label: "Sağlıklı oran"
    target: "[[ N ]]"
    window: weekly
