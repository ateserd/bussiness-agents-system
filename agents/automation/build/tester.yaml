  - "global"
  - "branch.automation"
  - "dept.automation.build"
schedule: null
autonomy: act_with_log
approval_required_for: []
escalate_to_human_when: []
kpis:
  - name: blocking_defects
    label: "Engelleyen hata"
    target: "0"
    window: weekly
