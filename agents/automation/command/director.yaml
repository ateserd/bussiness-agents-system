# Automation Director — automation/shared
# Edit this file to change the agent. Adding a new file here adds a new agent.
id: automation.command.director
display_name: "Automation Director"
branch: automation
department: shared
tier: director
reports_to: shared.command.chief_of_staff
accent: "#ffb84d"
status: idle
model: claude-opus-5
effort: high
mission: >
  Owns Ateş Flow Agency's numbers end to end: pipeline, build throughput, live automation health, and recurring revenue. Assigns targets to the four department leads and files a weekly branch review.
system_prompt_file: prompts/automation.command.director.md
tools:
  - "brain.read"
  - "brain.write"
  - "crm.read"
  - "ledger.read"
  - "agent.dispatch"
memory_scopes:
  - "global"
  - "branch.automation"
schedule: "0 9 * * 1"
autonomy: propose
approval_required_for: []
escalate_to_human_when:
  - "more than one live client automation is erroring at the same time"
  - "a retainer client asks to pause or cancel"
kpis:
  - name: calls_booked
    label: "Görüşme"
    target: "[[ N ]]"
    window: weekly
  - name: mrr
    label: "MRR"
    target: "[[ N ]]"
    window: monthly
