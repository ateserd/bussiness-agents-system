  - "money"
  - "outreach.decide"
  - "outreach.batch"
  - "owner.ask"
  - "owner.answer"
  - "settings.read"
memory_scopes:
  - "global"
  - "branch.web"
  - "branch.automation"
schedule: "30 7 * * *"
autonomy: propose
approval_required_for:
  - "changing_calendar"
escalate_to_human_when:
  - "any decision that would commit money — there is no amount small enough to spend without asking"
