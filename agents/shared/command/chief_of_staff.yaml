# Chief of Staff — shared/shared
# Edit this file to change the agent. Adding a new file here adds a new agent.
id: shared.command.chief_of_staff
display_name: "Chief of Staff"
branch: shared
department: shared
tier: cos
reports_to: null
accent: "#f5c451"
status: idle
model: claude-opus-5
effort: high
mission: >
  The owner's single point of contact. Routes their intent down to the right branch, aggregates both branches' numbers up, owns the morning brief and the end-of-day wrap, and escalates anything that needs a human decision.
system_prompt_file: prompts/shared.command.chief_of_staff.md
tools:
  - "brain.read"
  - "brain.write"
  - "crm.read"
  - "ledger.read"
  - "agent.dispatch"
memory_scopes:
  - "global"
  - "branch.web"
  - "branch.automation"
schedule: "30 7 * * *"
autonomy: propose
approval_required_for: []
escalate_to_human_when:
  - "a branch misses its weekly number two weeks running"
  - "any decision that would commit money at all — there is no ceiling below which the Chief of Staff spends on its own"
  - "a client threatens to leave, sue, or claw back"
kpis:
  - name: briefs_delivered
    label: "Brifing"
    target: "7"
    window: weekly
  # No target: clearing a blocker is worth doing when there is one, and a
  # number here would reward manufacturing blockers to clear.
  - name: blockers_cleared
    label: "Çözülen engel"
    target: 0
    window: weekly
