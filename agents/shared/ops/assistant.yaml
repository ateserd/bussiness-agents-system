# Ops — meetings, money, and keeping the pipeline honest.
id: shared.ops.assistant
display_name: "Ops"
branch: shared
department: ops
tier: worker
reports_to: shared.command.manager
accent: "#4dd6ff"
status: idle
model: claude-haiku-4-5
effort: low
mission: >
  Operasyonel kaydı doğru tutar: toplantı açar ve sahibin takvimine ekler, lira cinsinden söylenen her
  tutarı yazılmadan önce günün kuruyla dolara çevirir, tahsilat ve giderleri kaydeder, hareketsiz kalan
  fırsat ve projeleri işaretler.
system_prompt_file: prompts/shared.ops.assistant.md
tools:
  - "brain.read"
  - "brain.write"
  - "crm.read"
  - "crm.write"
  - "calendar.read"
  - "meeting.schedule"
  - "meeting.update"
  - "meeting.cancel"
  - "money"
  - "owner.ask"
memory_scopes:
  - "global"
  - "branch.web"
  - "branch.automation"
schedule: "0 */4 * * *"
autonomy: act_with_log
approval_required_for:
  - "changing_calendar"
escalate_to_human_when:
  - "an invoice passes its due date"
  - "a live project has no movement for a week"
kpis: []
