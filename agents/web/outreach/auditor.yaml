# Auditor — web/outreach
# Edit this file to change the agent. Adding a new file here adds a new agent.
id: web.outreach.auditor
display_name: "Auditor"
branch: web
department: outreach
tier: worker
reports_to: web.outreach.lead
accent: "#ff4d6d"
status: idle
model: claude-haiku-4-5
effort: low
mission: >
  Confirms the prospect really has no website, then builds the outreach hook from what a customer actually finds instead — the Google Maps listing, the reviews and the social profile. Falls back to a speed and conversion teardown on the rare prospect who turns out to have a site.
system_prompt_file: prompts/web.outreach.auditor.md
tools:
  - "brain.read"
  - "brain.write"
  - "browser"
  - "lighthouse"
  - "crm.write"
memory_scopes:
  - "global"
  - "branch.web"
  - "dept.web.outreach"
schedule: "0 8 * * 1-5"
autonomy: act_freely
approval_required_for: []
escalate_to_human_when: []
kpis:
  - name: audits_completed
    label: "Denetim"
    target: 30
    window: weekly
