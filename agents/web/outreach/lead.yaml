# Outreach Lead — web/outreach
# Edit this file to change the agent. Adding a new file here adds a new agent.
id: web.outreach.lead
display_name: "Outreach Lead"
branch: web
department: outreach
tier: lead
reports_to: web.command.director
accent: "#ff4d6d"
status: idle
model: claude-sonnet-5
effort: medium
mission: >
  Owns how many qualified conversations enter the web branch. Assigns list, audit, copy and send work to four agents and files the department's numbers to the Web Director each evening.
system_prompt_file: prompts/web.outreach.lead.md
tools:
  - "brain.read"
  - "brain.write"
  - "crm.read"
  - "agent.dispatch"
memory_scopes:
  - "global"
  - "branch.web"
  - "dept.web.outreach"
schedule: "15 15 * * 1-5"
autonomy: propose
approval_required_for: []
escalate_to_human_when:
  - "a prospect replies with a legal or refund threat"
kpis:
  - name: sequences_live
    label: "Canlı dizi"
    target: "[[ N ]]"
    window: weekly
