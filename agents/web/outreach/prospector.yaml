# Prospector — web/outreach
# Edit this file to change the agent. Adding a new file here adds a new agent.
id: web.outreach.prospector
display_name: "Prospector"
branch: web
department: outreach
tier: worker
reports_to: web.outreach.lead
accent: "#ff4d6d"
status: idle
model: claude-haiku-4-5
effort: low
mission: >
  Builds lead lists matching ICP A from the configured sources, deduplicates against everything already in the CRM, and hands each new lead to the Auditor.
system_prompt_file: prompts/web.outreach.prospector.md
tools:
  - "brain.read"
  - "brain.write"
  - "browser"
  - "crm.write"
memory_scopes:
  - "global"
  - "branch.web"
  - "dept.web.outreach"
schedule: "0 8 * * 1-5"
autonomy: act_with_log
approval_required_for:
  - "spending_money"
escalate_to_human_when: []
kpis:
  - name: leads_added
    label: "Lead"
    target: "[[ N ]]"
    window: weekly
