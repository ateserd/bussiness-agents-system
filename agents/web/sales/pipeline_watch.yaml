# Pipeline Watch — web/sales
# Edit this file to change the agent. Adding a new file here adds a new agent.
id: web.sales.pipeline_watch
display_name: "Pipeline Watch"
branch: web
department: sales
tier: worker
reports_to: web.sales.lead
accent: "#4dd6ff"
status: idle
model: claude-haiku-4-5
effort: low
mission: >
  Sweeps the web pipeline every four hours, flags every deal with no movement past the staleness threshold, and reports stage-by-stage conversion.
system_prompt_file: prompts/web.sales.pipeline_watch.md
tools:
  - "brain.read"
  - "brain.write"
  - "crm.read"
  - "crm.write"
memory_scopes:
  - "global"
  - "branch.web"
  - "dept.web.sales"
schedule: "0 */4 * * *"
autonomy: act_with_log
approval_required_for: []
escalate_to_human_when: []
kpis:
  - name: stale_flagged
    label: "Bayat fırsat"
    target: "0"
    window: weekly
