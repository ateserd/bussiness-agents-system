# Web Director — web/shared
# Edit this file to change the agent. Adding a new file here adds a new agent.
id: web.command.director
display_name: "Web Director"
branch: web
department: shared
tier: director
reports_to: shared.command.chief_of_staff
accent: "#4dd6ff"
status: idle
model: claude-opus-5
effort: high
mission: >
  Owns Ateş Design Agency's numbers end to end: pipeline, delivery throughput, and branch P&L. Assigns targets to the four department leads and files a weekly branch review.
system_prompt_file: prompts/web.command.director.md
tools:
  - "brain.read"
  - "brain.write"
  - "crm.read"
  - "ledger.read"
  - "agent.dispatch"
memory_scopes:
  - "global"
  - "branch.web"
schedule: "0 9 * * 1"
autonomy: propose
approval_required_for: []
escalate_to_human_when:
  - "the branch's weekly booked-call number is zero"
  - "a live project slips its launch date twice"
kpis:
  - name: calls_booked
    label: "Görüşme"
    target: "[[ N ]]"
    window: weekly
  - name: revenue_mtd
    label: "Ciro"
    target: "[[ N ]]"
    window: monthly
